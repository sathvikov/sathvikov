<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <style>
    .header { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 13px; fill: #fe428e; font-weight: bold; }
    .number { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: bold; font-size: 28px; fill: #f8d847; }
    .date { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #a9fef7; }
    .current-streak-title { fill: #f8d847; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="400" height="200" rx="10" fill="#141321" stroke="#1a1928" stroke-width="1.5" />
  
  <!-- Fire Icon (Animated Effect) -->
  <g transform="translate(185, 30)" fill="#fe428e">
    <path d="M12 0C6 4.5 3 9.5 3 14c0 5 4 9 9 9s9-4 9-9c0-4.5-3-9.5-9-14zm0 18c-2.8 0-5-2.2-5-5 0-1.8 1-3.6 2.5-4.8.3-.2.7 0 .7.4.1.8.5 1.5 1.1 2 .6.5 1.4.7 2.2.4.8-.3 1.5-1 1.7-1.8.2-.8 0-1.7-.5-2.4-.2-.3.1-.7.4-.6 1.8 1 2.9 2.9 2.9 4.8 0 2.8-2.2 5-5 5z" transform="scale(1.3)" />
  </g>
  
  <!-- Column 1: Total Contributions -->
  <g transform="translate(15, 95)" text-anchor="middle">
    <text x="60" y="0" class="header">TOTAL CONTRIBUTIONS</text>
    <text x="60" y="35" class="number">985</text>
    <text x="60" y="55" class="date">Feb 25 - Present</text>
  </g>
  
  <!-- Column 2: Current Streak -->
  <g transform="translate(135, 95)" text-anchor="middle">
    <text x="65" y="0" class="header current-streak-title">CURRENT STREAK</text>
    <text x="65" y="35" class="number">180</text>
    <text x="65" y="55" class="date">Jan 26 - Present</text>
  </g>
  
  <!-- Column 3: Longest Streak -->
  <g transform="translate(265, 95)" text-anchor="middle">
    <text x="60" y="0" class="header">LONGEST STREAK</text>
    <text x="60" y="35" class="number">180</text>
    <text x="60" y="55" class="date">Jan 26 - Present</text>
  </g>
  
  <!-- Border Dividers -->
  <line x1="140" y1="90" x2="140" y2="160" stroke="#1a1928" stroke-width="1.5" />
  <line x1="268" y1="90" x2="268" y2="160" stroke="#1a1928" stroke-width="1.5" />
</svg>
